<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F8F5EF" />
    <meta
      name="description"
      content="开铺手帐（Capiday）·手帐文具店，记录生活的美好，也收藏一点点变好的自己。"
    />
    <title>开铺手帐 · Capiday</title>
    <!-- Official app icon (docs/brand, tools/make_app_icon.py) -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="fonts.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="preview-label">
      <span><i></i> CAPIDAY · WEB PREVIEW</span
      ><span>HTML 交互预览 · 非 SwiftUI 运行画面</span>
    </div>
    <div class="desktop-note" aria-hidden="true">
      <div class="drawn-flower">✿</div>
      <p class="note-eyebrow">YOUR LITTLE STATIONERY SHOP</p>
      <h1>Capiday<span>小日子，慢慢记。</span></h1>
      <p>记录生活的美好，<br />也收藏一点点变好的自己。</p>
      <div class="color-swatches"><i></i><i></i><i></i><i></i></div>
      <span class="handwritten">a little more you, every day.</span>
    </div>
    <div class="phone" id="phone">
      <div class="phone-status">
        <span id="clock">9:41</span
        ><span style="font-size: 8px; letter-spacing: 1px; color: #9b9384"
          >WEB PREVIEW</span
        >
      </div>
      <div class="app-scroll" id="app-scroll">
        <main id="app">
          <div class="loading"><span>✿</span>正在打开你的文具店…</div>
        </main>
      </div>
      <nav class="bottom-nav" id="navigation" aria-label="主要导航"></nav>
      <div id="tour" class="tour" hidden></div>
    </div>
    <div class="preview-footnote">数据保存在当前浏览器 · 示例内容可编辑</div>
    <dialog id="form-dialog"><form id="dialog-form"></form></dialog>
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-message">
      <form method="dialog">
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button id="confirm-cancel" class="secondary" value="cancel">取消</button>
          <button id="confirm-ok" class="primary" value="ok">确定</button>
        </div>
      </form>
    </dialog>
    <dialog id="export-dialog" class="export-dialog" aria-labelledby="export-title">
      <p id="export-title">正在导出视频</p>
      <div class="export-bar"><span id="export-progress"></span></div>
      <p id="export-time" class="save-help"></p>
      <div class="dialog-actions"><button type="button" id="export-cancel" class="secondary">取消</button></div>
    </dialog>
    <dialog id="photo-editor" class="photo-editor" aria-label="Photo editor"></dialog>
    <dialog id="poster-dialog" class="poster-dialog" aria-label="Video cover"></dialog>
    <dialog id="scene-dialog" class="scene-dialog" aria-label="Scenes"></dialog>
    <dialog id="choose-dialog" class="choose-dialog" aria-label="Add a picture"></dialog>
    <dialog id="lightbox" class="lightbox">
      <button type="button" class="lightbox-close" data-action="close-lightbox" aria-label="Close">×</button>
      <img id="lightbox-image" alt="" />
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="photo-input" type="file" accept="image/*" hidden />
    <input id="photos-input" type="file" accept="image/*" multiple hidden />
    <input id="attachment-image-input" type="file" accept="image/*" hidden />
    <input
      id="video-input"
      type="file"
      accept="video/mp4,video/webm,video/ogg"
      hidden
    />
    <input id="audio-input" type="file" accept="audio/*" hidden />
    <input
      id="backup-input"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <noscript>请启用 JavaScript，以使用开铺手帐交互预览。</noscript>
  </body>
</html>
