<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f1" />
    <title>Notebook · 本地工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d4c40'/%3E%3Ctext x='7' y='24' fill='white' font-size='24'%3EN%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Notebook 首页"
        ><span class="brand-icon">N</span>Notebook<span
          class="brand-divider"
        ></span
        ><span class="brand-subtitle">本地工作台</span></a
      >
      <span class="local-badge">仅本机访问</span>
    </header>
    <main>
      <div class="eyebrow"><span></span>一个属于你的工作空间</div>
      <h1>从这里，<br />开始下一页。</h1>
      <p class="intro">
        欢迎来到 Notebook。这里是软件的本地预览入口，<br
          class="desktop-break"
        />后续功能会在这个工作台中逐步完善。
      </p>
      <section class="workspace" aria-labelledby="workspace-title">
        <div class="workspace-heading">
          <span class="small-label">工作台 / 概览</span
          ><span class="outline-tag">LOCAL PREVIEW</span>
        </div>
        <div class="workspace-body">
          <div class="paper-icon" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <h2 id="workspace-title">你的工作台已准备好</h2>
          <p>本地启动框架已建立，等待加入你的第一项功能。</p>
          <a class="text-link" href="#connection"
            >查看服务状态 <span aria-hidden="true">↗</span></a
          >
        </div>
        <div class="connection" id="connection">
          <div class="connection-info">
            <span class="status-dot" id="status-dot"></span>
            <div>
              <h3>本地服务</h3>
              <p id="service-status" role="status" aria-live="polite">
                正在连接…
              </p>
            </div>
          </div>
          <button id="check-connection" type="button">
            重新检测 <span aria-hidden="true">↻</span>
          </button>
        </div>
      </section>
      <footer>
        <span>NOTEBOOK</span>
        <p>让想法，有一个开始的地方。</p>
      </footer>
    </main>
  </body>
</html>
